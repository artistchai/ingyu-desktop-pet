name: Build and Release

# 실행 조건: v로 시작하는 태그(예: v1.0.0)를 push하면 자동으로 실행됨
# 예: git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags:
      - 'v*'
  # 태그 없이도 수동으로 실행해서 빌드만 테스트해보고 싶을 때 사용 (Actions 탭에서 "Run workflow" 버튼으로 실행)
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        # macOS와 Windows 각각에서 병렬로 빌드가 진행됨
        os: [macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: Node.js 설치
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 의존성 설치
        run: npm install

      - name: macOS용 빌드
        if: matrix.os == 'macos-latest'
        run: npm run dist:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Windows용 빌드
        if: matrix.os == 'windows-latest'
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 빌드 결과물을 GitHub Release에 업로드
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.dmg
            release/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
